[project]
name = "ble-testing-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pyserial>=3.5",
    "pytest-html>=4.2.0",
    "pytest-order>=1.3.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "hil: hardware-in-the-loop test that requires a running peer device/process",
]
